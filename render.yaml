services:
  - type: web
    name: cinelog-api
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: OMDB_BASE_URL
        value: https://www.omdbapi.com/
      - key: TMDB_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: jpgf.profissional@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_VERIFICATION_CODE_MINUTES
        value: "15"
      - key: EMAIL_VERIFICATION_RESEND_SECONDS
        value: "60"
